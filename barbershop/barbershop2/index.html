<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharp Cuts Barbershop - Midnight Fade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Sharp Cuts Barbershop</h1>
<p>Clean fades, sharp lineups, walk-ins welcome</p>

<img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=800&q=80" alt="Barber cutting hair">
<img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=800&q=80" alt="Inside the barbershop">

<h2>Services</h2>
<section class="cards">
<div class="card">
<h3>Haircut</h3>
<p class="price">$25</p>
</div>

<div class="card">
<h3>Fade</h3>
<p class="price">$30</p>
</div>

<div class="card">
<h3>Beard Trim</h3>
<p class="price">$15</p>
</div>

<div class="card">
<h3>Kids Cut</h3>
<p class="price">
</div>
</section>

<h2>Book a Callback</h2>
<p>Leave your name and number and well get back to you with booking times</p>
<form id="callback">

<label>Name</label>
<input type="text" name="name" required>
<label>Phone</label>
<input type="tel" name="phone" required>
<label>Service</label>

<select name="service">
<option>Haircut</option>
<option>Fade</option>
<option>Beard Trim</option>
<option>Kids Cut</option>
</select>

<button type="submit">Request a Call back</button>
</form>
<p id="thanks"></p>

<p>Hours:Mon - Sat 9AM-7PM, Sunday: closed</p>
<p>123 Main St, Woonsocket, RI</p>
<p><a href="Back to Frant Websites"</a></p>

<script src="script.js"></script>

</body>
</html>
